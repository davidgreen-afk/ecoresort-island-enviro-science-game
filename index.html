<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island Reborn: The Ecoresort Challenge</title>
<meta name="description" content="A team-based sustainability game. Rebuild a degraded island as an ecoresort and watch your decisions bring it to life.">
<style>
:root {
  --navy: #0D2137; --navy2: #14304d; --teal: #0B7A75; --teal2: #14A5A0; --gold: #F4A825; --slate: #334155;
  --foam: #E8F3F1; --paper: #FBFDFC; --coral: #D9483B; --leaf: #2f855a; --ink: #14212e; --line: #c7d6d3;
  --serif: Georgia, "Times New Roman", serif; --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--sans); color: var(--ink); background: var(--navy); font-size: 15px; line-height: 1.5; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--serif); margin: 0; }

/* Top bar */
#top { display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: var(--navy); color: #fff; border-bottom: 3px solid var(--teal); flex-wrap: wrap; }
#top .brand { font-family: var(--serif); font-size: 22px; letter-spacing: .2px; }
#top .brand small { display: block; font-family: var(--sans); font-size: 11px; color: #9fc3c0; letter-spacing: 0; }
#top .grow { flex: 1; }
.chip { background: rgba(255,255,255,.1); border-radius: 999px; padding: 4px 12px; font-size: 13px; white-space: nowrap; }
.chip b { color: var(--gold); }
.btn { border: 0; border-radius: 8px; padding: 9px 16px; background: var(--teal); color: #fff; font-weight: 600; }
.btn:hover { background: var(--teal2); }
.btn.gold { background: var(--gold); color: var(--navy); }
.btn.gold:hover { background: #ffbd47; }
.btn.ghost { background: transparent; border: 1.5px solid currentColor; color: inherit; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* Quest rail */
#quest { display: flex; gap: 4px; overflow-x: auto; padding: 8px 14px; background: var(--navy2); scrollbar-width: thin; }
#quest button { flex: 0 0 auto; border: 0; background: transparent; color: #9fc3c0; padding: 5px 9px; border-radius: 8px; font-size: 18px; position: relative; }
#quest button.done { color: #fff; }
#quest button.done::after { content: ""; position: absolute; left: 20%; right: 20%; bottom: 0; height: 3px; border-radius: 2px; background: var(--teal2); }
#quest button.cur { background: var(--gold); }
#quest button.lock { opacity: .35; cursor: default; }

/* Layout */
#game { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(360px, 1fr); gap: 16px; padding: 16px; align-items: start; max-width: 1500px; margin: 0 auto; }
#stage { position: sticky; top: 8px; display: grid; gap: 10px; }
.scene-wrap { position: relative; border-radius: 14px; overflow: hidden; border: 3px solid #061525; box-shadow: 0 8px 30px rgba(0,0,0,.4); background: #0a3358; }
#scene { display: block; width: 100%; aspect-ratio: 960 / 600; }
.scene-hud { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.scene-hud .chip { background: rgba(13,33,55,.78); color: #fff; backdrop-filter: blur(3px); }
.scene-tools { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
.scene-tools button { border: 0; border-radius: 8px; background: rgba(13,33,55,.78); color: #fff; padding: 6px 10px; }
.scene-tools button[aria-pressed="true"] { background: var(--gold); color: var(--navy); }
.scene-note { position: absolute; left: 10px; bottom: 10px; right: 10px; background: rgba(13,33,55,.85); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 13px; display: none; }

/* Board strip and tabs */
.board { display: flex; gap: 12px; align-items: center; background: #0e2a45; border-radius: 12px; padding: 8px 12px; color: #fff; flex-wrap: wrap; }
.board .dir { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.board .dir small { color: #9fc3c0; display: block; }
.board .rname { font-family: var(--serif); font-size: 17px; margin-right: auto; }
.tabs { background: var(--paper); border-radius: 12px; overflow: hidden; }
.tabbar { display: flex; background: var(--foam); border-bottom: 1px solid var(--line); }
.tabbar button { flex: 1; border: 0; background: transparent; padding: 8px 6px; font-weight: 600; color: var(--slate); border-bottom: 3px solid transparent; }
.tabbar button[aria-selected="true"] { color: var(--teal); border-bottom-color: var(--teal); background: #fff; }
.tabpane { padding: 12px 14px; max-height: 320px; overflow: auto; }
.meters { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 18px; }
.meter .lab { display: flex; justify-content: space-between; font-size: 13px; color: var(--slate); }
.meter .lab b { color: var(--ink); }
.meter .bar { height: 9px; background: #dde8e6; border-radius: 6px; overflow: hidden; margin-top: 2px; }
.meter .bar i { display: block; height: 100%; border-radius: 6px; transition: width .6s ease; }
.delta { font-size: 11px; margin-left: 4px; }
.delta.up { color: var(--leaf); } .delta.down { color: var(--coral); }
.money { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; font-size: 13px; }
.money div { background: var(--foam); border-radius: 8px; padding: 6px 8px; }
.money b { display: block; font-family: var(--serif); font-size: 17px; color: var(--navy); }
.budgetbar { height: 10px; background: #dde8e6; border-radius: 6px; overflow: hidden; margin-top: 8px; position: relative; }
.budgetbar i { display: block; height: 100%; background: var(--teal); transition: width .5s; }
.budgetbar i.over { background: var(--coral); }

/* Phase panel */
#panel { background: var(--paper); border-radius: 14px; padding: 18px 20px 20px; border-left: 6px solid var(--teal); box-shadow: 0 8px 30px rgba(0,0,0,.35); min-height: 300px; }
.ph-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
.ph-head .ic { font-size: 30px; line-height: 1; }
.ph-head h2 { font-size: 24px; color: var(--navy); line-height: 1.15; }
.ph-head .sub { font-size: 13px; color: var(--slate); margin-top: 2px; }
.lead { display: flex; align-items: center; gap: 8px; background: var(--foam); border-radius: 10px; padding: 6px 10px; font-size: 13px; margin: 8px 0 12px; }
.lead b { color: var(--teal); }
.talk { display: flex; gap: 12px; margin: 10px 0 14px; }
.talk .bubble { background: #fff; border: 1.5px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 10px 14px; flex: 1; }
.talk .bubble .who { font-weight: 700; color: var(--navy); font-size: 13px; }
.talk .bubble .who span { font-weight: 400; color: var(--slate); }
.talk .bubble p { margin: 4px 0 0; }
.insight { border: 1.5px dashed var(--gold); background: #fff8e6; border-radius: 10px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; margin-bottom: 12px; font-size: 14px; }
.grp { margin: 16px 0; }
.grp h3 { font-size: 18px; color: var(--navy); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.grp h3 small { font-family: var(--sans); font-size: 12px; font-weight: 400; color: var(--slate); }
.grp .prompt { margin: 2px 0 8px; color: var(--slate); font-size: 14px; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 44px 1fr; gap: 10px; text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 10px; color: inherit; position: relative; transition: border-color .15s, background .15s, transform .15s; }
.opt:hover { border-color: var(--teal); }
.opt .oi { font-size: 26px; display: grid; place-items: center; background: var(--foam); border-radius: 8px; }
.opt .on { font-weight: 700; color: var(--navy); }
.opt .od { font-size: 13.5px; color: var(--slate); }
.opt.sel { border-color: var(--teal); background: #e6f6f4; box-shadow: inset 4px 0 0 var(--teal); }
.opt.sel::after { content: "✓"; position: absolute; right: 10px; top: 6px; color: #fff; background: var(--teal); width: 20px; height: 20px; border-radius: 50%; text-align: center; font-size: 13px; line-height: 20px; }
.opt.bad { border-color: var(--coral); background: #fdecea; box-shadow: inset 4px 0 0 var(--coral); }
.opt.bad::after { background: var(--coral); content: "!"; }
.opt.full:not(.sel) { opacity: .5; }
.eff { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.eff span { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: #eef3f2; color: var(--slate); }
.eff span.g { background: #dff3e6; color: #1d6b3f; } .eff span.b { background: #fde4e1; color: #a63428; }
.onote { font-size: 12.5px; color: #6b4e00; background: #fff4d6; border-radius: 6px; padding: 4px 8px; margin-top: 5px; }
.cov { margin: 10px 0; }
.cov .row { display: grid; grid-template-columns: 90px 1fr 56px; gap: 8px; align-items: center; font-size: 13px; margin: 3px 0; }
.cov .bar { height: 12px; background: #dde8e6; border-radius: 7px; position: relative; overflow: hidden; }
.cov .bar i { display: block; height: 100%; transition: width .5s; }
.cov .bar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(13,33,55,.5); }
.note { background: var(--foam); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; margin: 10px 0; }
details.field { margin: 10px 0; border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 12px; background: #fff; }
details.field summary { cursor: pointer; font-weight: 600; color: var(--teal); }
.quiz, .reflect { margin: 14px 0; padding: 12px 14px; border-radius: 12px; background: #fff; border: 1.5px solid var(--line); }
.quiz h4, .reflect h4 { margin: 0 0 6px; font-family: var(--serif); color: var(--navy); font-size: 16px; }
.qopt { display: block; width: 100%; text-align: left; border: 1.5px solid var(--line); background: var(--paper); padding: 7px 10px; border-radius: 8px; margin: 4px 0; }
.qopt:hover { border-color: var(--teal); }
.qopt.right { background: #dff3e6; border-color: var(--leaf); }
.qopt.wrong { background: #fde4e1; border-color: var(--coral); }
.why { font-size: 13.5px; margin-top: 6px; color: var(--slate); }
textarea, input[type=text], select { width: 100%; font: inherit; border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; color: var(--ink); }
textarea { min-height: 76px; resize: vertical; }
.foot { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.issues { color: var(--coral); font-size: 13px; margin: 0; padding-left: 18px; flex: 1 1 100%; }
.slider { display: flex; gap: 10px; align-items: center; }
.slider input[type=range] { flex: 1; accent-color: var(--teal); }
.slider output { min-width: 84px; font-family: var(--serif); font-weight: 700; color: var(--navy); text-align: right; }
.zone { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; background: #fff; }
.zone .zt { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; color: var(--navy); }
.zone .zq { font-family: var(--serif); font-size: 18px; }
.zone p { margin: 2px 0 6px; font-size: 13px; color: var(--slate); }

/* Avatar builder */
.dirs { display: grid; gap: 12px; }
.dircard { border: 1.5px solid var(--line); border-radius: 12px; background: #fff; padding: 10px; display: grid; grid-template-columns: 96px 1fr; gap: 12px; }
.dircard .fields { display: grid; gap: 6px; grid-template-columns: 1fr 1fr; }
.dircard .fields .full { grid-column: 1 / -1; }
.dircard label { font-size: 12px; color: var(--slate); display: block; }
.swatches { display: flex; gap: 4px; flex-wrap: wrap; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1.5px var(--line); padding: 0; }
.sw.on { box-shadow: 0 0 0 2.5px var(--navy); }
.pillbtn { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 2px 9px; font-size: 12px; }
.pillbtn.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.pal { display: flex; gap: 8px; }
.pal button { width: 44px; height: 30px; border-radius: 8px; border: 3px solid #fff; box-shadow: 0 0 0 1.5px var(--line); }
.pal button.on { box-shadow: 0 0 0 3px var(--navy); }

/* Species and map */
.spcards { display: grid; gap: 8px; }
.spc { display: grid; grid-template-columns: 52px 1fr; gap: 10px; text-align: left; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; padding: 10px; }
.spc .big { font-size: 38px; display: grid; place-items: center; }
.spc.sel { border-color: var(--teal); background: #e6f6f4; }
.spc i { color: var(--slate); font-size: 12.5px; }
.needs { display: flex; gap: 4px; margin-top: 4px; }
.needs span { font-size: 11px; background: var(--foam); border-radius: 6px; padding: 1px 6px; }
.fpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.fpick button { border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 6px 8px; text-align: left; font-size: 13px; }
.fpick button.on { border-color: var(--gold); background: #fff4d6; }
.fpick button.placed::after { content: " ✓"; color: var(--leaf); }
.rep { font-size: 13px; margin: 6px 0; }
.rep .t { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.t.good, .t.ok { background: #4ade80; } .t.warn { background: #fde047; } .t.bad { background: #fb7185; }

/* Sim, results */
.evcard { border: 2px solid var(--navy); border-radius: 14px; padding: 14px; background: #fff; margin: 10px 0; }
.evcard h3 { font-size: 20px; }
.evchoice { display: block; width: 100%; text-align: left; border: 1.5px solid var(--line); background: var(--paper); border-radius: 10px; padding: 9px 12px; margin: 6px 0; }
.evchoice:hover { border-color: var(--teal); background: #e6f6f4; }
.dchips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.dchips span { font-size: 12px; padding: 2px 8px; border-radius: 999px; }
.dchips .g { background: #dff3e6; color: #1d6b3f; } .dchips .b { background: #fde4e1; color: #a63428; }
.grade { font-family: var(--serif); font-size: 72px; line-height: 1; color: var(--navy); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.badge { border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; background: #fff; font-size: 13px; }
.badge.off { opacity: .4; filter: grayscale(1); }
.badge b { display: block; }
.timeline { display: grid; gap: 6px; font-size: 13.5px; }
.timeline div { border-left: 4px solid var(--teal); padding: 4px 10px; background: #fff; border-radius: 0 8px 8px 0; }
.scale { display: grid; grid-template-columns: 1fr 190px; gap: 10px; align-items: center; margin: 8px 0; font-size: 13.5px; }
.scale output { font-weight: 700; color: var(--navy); }

/* Modal */
#modal { position: fixed; inset: 0; background: rgba(6,21,37,.72); display: none; place-items: center; z-index: 50; padding: 16px; }
#modal.open { display: grid; }
#modal .box { background: var(--paper); border-radius: 16px; max-width: 640px; width: 100%; max-height: 88vh; overflow: auto; padding: 22px 24px; border-top: 6px solid var(--gold); }
#modal h2 { color: var(--navy); margin-bottom: 8px; }
#modal .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }

.hero { border-radius: 14px; background: linear-gradient(160deg, #0b3358, #0B7A75); color: #fff; padding: 20px; margin-bottom: 12px; }
.hero h2 { font-size: 30px; }
.hero p { margin: 8px 0 0; }
.diffs { display: grid; gap: 8px; margin: 10px 0; }
.diffs button { text-align: left; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; }
.diffs button.on { border-color: var(--teal); background: #e6f6f4; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 8px 16px; border-radius: 999px; z-index: 60; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.sr { position: absolute; left: -9999px; }

@media (max-width: 1000px) {
  #game { grid-template-columns: 1fr; padding: 10px; }
  #stage { position: static; }
  .tabpane { max-height: none; }
  .dircard { grid-template-columns: 1fr; justify-items: center; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print { #quest, #top, #stage .scene-tools { display: none; } body { background: #fff; } }

/* Walking, dialogue, quests */
.prompt { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); border: 2px solid var(--navy); background: var(--gold); color: var(--navy); font-weight: 700; padding: 7px 16px; border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,.4); animation: bob 1.2s ease-in-out infinite; z-index: 3; }
.prompt kbd { background: var(--navy); color: #fff; border-radius: 5px; padding: 1px 7px; margin-right: 6px; font-family: inherit; }
@keyframes bob { 50% { transform: translateX(-50%) translateY(-4px); } }
.dlg { position: absolute; left: 10px; right: 10px; bottom: 10px; background: rgba(251,253,252,.98); border: 3px solid var(--navy); border-radius: 14px; padding: 10px 12px; display: grid; grid-template-columns: 76px 1fr; gap: 12px; box-shadow: 0 8px 26px rgba(0,0,0,.5); z-index: 4; max-height: 88%; overflow: auto; }
.dlg .who { font-family: var(--serif); font-weight: 700; color: var(--navy); }
.dlg .who small { font-family: var(--sans); font-weight: 400; color: var(--slate); margin-left: 6px; }
.dlg .txt { margin: 4px 0 8px; min-height: 42px; font-size: 15px; }
.dlg .ch { display: grid; gap: 5px; }
.dlg .ch button { text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; }
.dlg .ch button:hover { border-color: var(--teal); background: #e6f6f4; }
.dlg .ch button kbd { background: var(--navy); color: #fff; border-radius: 4px; padding: 0 6px; margin-right: 6px; font-size: 12px; }
.dlg .gain { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
.dlg .gain span { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #dff3e6; color: #1d6b3f; }
.dlg .gain span.b { background: #fde4e1; color: #a63428; }
.dpad { position: absolute; left: 10px; bottom: 10px; display: none; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); gap: 4px; z-index: 3; }
.dpad button { border: 0; border-radius: 10px; background: rgba(13,33,55,.72); color: #fff; font-size: 18px; touch-action: none; }
.dpad button[data-d=up] { grid-column: 2; grid-row: 1; } .dpad button[data-d=left] { grid-column: 1; grid-row: 2; } .dpad button[data-d=down] { grid-column: 2; grid-row: 2; } .dpad button[data-d=right] { grid-column: 3; grid-row: 2; }
@media (pointer: coarse) { .dpad { display: grid; } }
.board button.dir { border: 2px solid transparent; background: transparent; color: inherit; text-align: left; border-radius: 10px; padding: 2px 6px; }
.board button.dir.hero { border-color: var(--gold); background: rgba(244,168,37,.16); }
.consult { border: 2px solid var(--gold); background: #fff8e6; border-radius: 12px; padding: 10px 12px; margin: 10px 0 14px; display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; }
.consult.done { border-color: var(--leaf); background: #eaf7ee; }
.consult ul { margin: 4px 0 0; padding-left: 18px; font-size: 13.5px; }
.consult .acts { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
.linkbtn { background: none; border: 0; color: var(--slate); text-decoration: underline; padding: 0; font-size: 13px; }
.quest { border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 10px; margin: 6px 0; background: #fff; font-size: 13.5px; }
.quest b { color: var(--navy); }
.quest .qbar { height: 7px; background: #dde8e6; border-radius: 5px; overflow: hidden; margin-top: 4px; }
.quest .qbar i { display: block; height: 100%; background: var(--teal); }
.quest .ck { color: var(--leaf); font-weight: 700; }
.legend { font-size: 12.5px; color: var(--slate); margin-top: 4px; }

.opt.locked { background: #f1f4f4; border-style: dashed; color: #64748b; }
.opt.locked .oi { background: #e2e8e8; }
.opt.locked .on { color: #475569; }
.onote.lock { background: #eef1f4; color: #475569; }
.toast { max-width: 92vw; text-align: center; border-radius: 14px; }

.dlgx { position: absolute; top: 6px; right: 8px; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--navy); background: #fff; color: var(--navy); font-size: 14px; font-weight: 700; line-height: 1; padding: 0; z-index: 5; }
.dlgx:hover { background: var(--gold); }
.dlg .who { padding-right: 34px; }

/* Author display rules must not defeat the hidden attribute */
[hidden] { display: none !important; }

</style>
</head>
<body>
<header id="top">
  <div class="brand"><span id="gameTitle">Island Reborn</span><small id="gameSub">The Ecoresort Challenge</small></div>
  <span class="chip" id="chipResort" hidden></span>
  <span class="grow"></span>
  <span class="chip">Year <b id="chipYear">2030</b></span>
  <span class="chip">Knowledge points <b id="chipKP">0</b></span>
  <button class="btn ghost small" id="btnMenu" aria-haspopup="dialog">Menu</button>
</header>

      brief: ["Every guest uses water, and an island has no river to borrow from. Pick the mix that keeps taps running in a dry season without draining the freshwater lens or harming the reef."],
      insight: "Check the coverage bar. If supply falls short you will truck in emergency water, which costs money and adds to your footprint.",
      science: "Small islands rely on a thin lens of fresh groundwater floating on denser seawater. Pumping too fast pulls salt water upward, and desalination brine must be diffused so it does not stress nearby reef and seagrass.",
      reflect: "Which water sources did you choose, and how do they protect both guests and the ecosystem?",
      quiz: { q: "Why is over-pumping groundwater risky on a small island?", opts: ["Salt water can move into the freshwater lens", "It stops rainfall", "It cools the ocean"], a: 0, why: "This is called saltwater intrusion, and it can ruin a well for years." } },
    { id: "food", title: "Food", icon: "🥭", advisor: "iris", type: "groups", groups: ["food"], expert: ["hosp", "soc", "biz", "bio"],
      brief: ["Island families have fished these waters for generations. Your kitchens can either feed the community or compete with it."],
      insight: "Local food keeps money on the island, but only if catch limits and farming methods protect the sea and soil.",
      science: "Locally produced food cuts transport emissions and keeps money circulating, but overfishing and fertilizer runoff can harm the same ecosystems, so sourcing needs limits.",
      reflect: "Where will your food come from, and how does that choice affect the community and the environment?",
      quiz: { q: "Which choice best reduces food miles?", opts: ["Buying from local farms and fishers", "Flying in fresh produce weekly", "Buying only imported organic food"], a: 0, why: "Shorter supply chains mean less fuel burned per meal." } },
    { id: "energy", title: "Energy", icon: "⚡", advisor: "marcus", type: "groups", groups: ["energy"], expert: ["eng", "cs", "pol"],
      brief: ["Diesel is cheap to install and expensive to live with. Sun, wind, and biomass cost more up front. Batteries carry daytime power into the night.", "Cutting demand first is usually the cheapest kilowatt you will ever find."],
      insight: "Look at renewable share, not just total coverage. A grid that is 100% covered but mostly diesel is a footprint problem.",
      science: "Renewable microgrids pair generation (solar, wind) with storage and efficiency. Fuel that arrives by ship is also a resilience risk when prices spike.",
      reflect: "How does your energy plan supply the resort, and what tradeoffs did you accept?",
      quiz: { q: "What is the main job of battery storage in a solar microgrid?", opts: ["Store daytime solar for evening and night demand", "Make panels produce more power", "Purify seawater"], a: 0, why: "Demand peaks after sunset, when solar is not producing." } },
    { id: "waste", title: "Waste", icon: "♻️", advisor: "marcus", type: "groups", groups: ["waste"], expert: ["eng", "bio", "edu"],
      brief: ["The brief is blunt: shipping waste elsewhere or dumping it is not acceptable. Waste is a design problem to solve on the island.", "The derelict resort left tons of rubble too. Deconstructing it well is part of the plan."],
      insight: "Wastewater counts as waste. A constructed wetland can treat it and create habitat at the same time.",
      science: "The waste hierarchy ranks reduce and reuse first, then recycling and composting, then energy recovery, with disposal last. Constructed wetlands can clean wastewater while providing habitat.",
      reflect: "How will your resort get rid of waste without shipping it away or dumping it?",
      quiz: { q: "Which step is highest in the waste hierarchy?", opts: ["Reduce and reuse", "Landfill", "Recycling only"], a: 0, why: "Preventing waste beats every method of handling it." } },
    { id: "transport", title: "Transportation", icon: "⛴️", advisor: "elena", type: "groups", groups: ["transportIsland", "transportOff"], expert: ["eng", "pol", "biz"],
      brief: ["Getting people to the island is often the largest slice of a tourism footprint. Choose both how people move on the island and how they reach it."],
      insight: "A single runway can outweigh every other green choice you make. Price out the whole trip, not just the last mile.",
      science: "Air travel is the largest emitter per passenger-kilometre in most tourism trips. Boats vary widely with speed and fuel, while walking, cycling, and electric shuttles keep on-island emissions small.",
      reflect: "What is your transportation plan on the island and between the island and other places?",
      quiz: { q: "Which usually emits the most per passenger-kilometre?", opts: ["Private jet", "Ferry", "Bicycle"], a: 0, why: "Small aircraft burn a lot of fuel for very few passengers." } },
    { id: "housing", title: "Employee housing", icon: "🏘️", advisor: "iris", type: "groups", groups: ["housing", "housingPolicy"], expert: ["soc", "ph", "edu"],
      brief: ["The people who run the resort need somewhere decent to live. Where and how you house them decides who benefits from your project."],
      insight: "Ask who is missing from your plan. Housing is where fairness turns into a building.",
      science: "Employee housing shapes commute emissions, whether wages stay in the community, and pressure on local housing. Building on already-cleared land avoids new habitat loss.",
      reflect: "Where is employee housing, and how does it minimize ecological impact?",
      quiz: { q: "Why does housing staff on the island support sustainability?", opts: ["Shorter commutes, stronger community ties, and more local spending", "Workers do not need water", "It lets you skip wastewater treatment"], a: 0, why: "Living close to work cuts travel and keeps wages local." } },
    { id: "health", title: "Public health", icon: "🩺", advisor: "kenji", type: "groups", groups: ["health"], expert: ["ph", "bio"],
      brief: ["A remote island cannot count on a hospital next door. Guests and staff need care on site, clean water, and a plan for outbreaks and emergencies."],
      insight: "Prevention is cheaper than treatment. Water testing and mosquito control protect more people than a clinic alone.",
      science: "The One Health approach links human, animal, and ecosystem health. Blanket pesticide spraying can harm pollinators and marine life. Integrated vector management targets breeding sites instead.",
      reflect: "How will you manage healthcare for employees and guests, and address public health issues?",
      quiz: { q: "What is the One Health idea?", opts: ["Human, animal, and environmental health are linked", "Everyone gets one health check a year", "Islands only need one clinic"], a: 0, why: "Problems in one area, such as polluted water, show up in the others." } },
    { id: "midpoint", title: "Midpoint board review", icon: "📈", advisor: "elena", type: "midpoint", expert: ["hosp", "ph", "biz"],
      brief: ["Halfway there. The board wants an honest look at how your plan is shaping up before you commit to the habitat work."],
      insight: "Look for a gap between your best and worst dial. Balanced plans survive storms.",
      science: "Formative checkpoints help teams see what is working before final decisions lock in. Compare your numbers with your goals, not with other teams.",
      reflect: "Name one decision you are proud of and one you would revisit. What evidence would change your mind?" },
    { id: "habitats", title: "Wildlife areas and corridors", icon: "🦜", advisor: "nia", type: "habitats", groups: ["corridors"], expert: ["bio", "cs"],
      brief: ["This is the heart of the plan. The island's wildlife needs four connected habitats: watershed, inland reserves, mangroves, and reef. Invest in each, then connect them.", "Your weakest habitat limits the whole chain, so balance matters."],
      insight: "Restoration has diminishing returns. The tenth million in one habitat rarely beats the first million in a neglected one.",
      science: "Ecosystems are connected. Runoff from the watershed shapes estuary water, mangroves shelter young fish that later live on reefs, and animals need corridors to move between habitats.",
      reflect: "Why did you choose this restoration and corridor plan, and how does it preserve biodiversity?",
      quiz: { q: "Why do mangroves matter for reef fish?", opts: ["Many reef fish shelter in mangrove roots as juveniles", "Mangroves make coral grow faster by shading it", "Mangroves add sand to reefs"], a: 0, why: "Mangroves are nurseries that later stock the reef." } },
    { id: "species", title: "Indicator species", icon: "🐢", advisor: "nia", type: "species", expert: ["bio"],
      brief: ["Pick one indicator species. If it thrives, the ecosystem is probably healthy. Then prove you understand its niche in each habitat."],
      insight: "A good indicator needs several habitats in good shape at once. That is what makes it a good alarm bell.",
      science: "A niche is the full set of conditions and resources a species uses and the roles it plays. Indicator species reveal ecosystem health because they depend on many parts of the system.",
      reflect: "Describe your species' way of life and how it interacts with each ecosystem type on your island." },
    { id: "climate", title: "Climate and sea-level rise", icon: "🌀", advisor: "marcus", type: "groups", groups: ["climate"], expert: ["eng", "bio", "pol"],
      brief: ["Seas are rising and storms are getting stronger. Protect the island without walling off the ecosystem you are restoring."],
      insight: "Ask what each defense does to connectivity. Anything that blocks habitats from shifting inland will cost you later.",
      science: "Nature-based defenses such as mangroves, dunes, and reefs absorb wave energy and can keep pace with sea-level rise. Hard seawalls reflect waves, erode beaches, and block habitat migration.",
      reflect: "How will you protect the island from climate change while keeping ecological integrity and connectivity?",
      quiz: { q: "Which shoreline approach can grow upward as seas rise?", opts: ["Living shorelines such as mangroves and oyster reef", "A concrete seawall", "A paved parking lot"], a: 0, why: "Living systems can build sediment and adapt; concrete cannot." } },
    { id: "earthcharter", title: "Earth Charter learning module", icon: "🌍", advisor: "iris", type: "earthcharter", groups: ["ec1", "ec2", "ec3", "ec4"], expert: ["edu", "soc", "comm", "pol"],
      brief: ["The Earth Charter rests on four pillars. Show how your resort teaches and practices each one with the community, and prove you can tell them apart."],
      insight: "Education that only happens at the resort is outreach in name only. Give the community a real role.",
      science: "The Earth Charter is a global statement of ethical principles for a just, sustainable, and peaceful world. Its four main parts cover respect and care for life, ecological integrity, social and economic justice, and democracy, nonviolence, and peace.",
      reflect: "How will your resort provide education and outreach to the local community about your sustainable development plans?" },
    { id: "footprint", title: "Ecological footprint", icon: "👣", advisor: "nia", type: "groups", groups: ["footprint"], footprintChart: true, expert: ["cs", "edu", "bio"],
      brief: ["Time to shrink what is left. Think back to the footprint exercise from earlier in the semester. Where does most of your footprint come from?"],
      insight: "Attack the biggest bar first. Offsets are the last step after avoiding and reducing.",
      science: "An ecological footprint estimates the land and sea area needed to supply what you use and absorb your waste. Avoid first, reduce second, and offset only what remains.",
      reflect: "How does your plan minimize the resort's overall ecological footprint?",
      quiz: { q: "What does an ecological footprint estimate?", opts: ["The land and sea area needed to supply resources and absorb waste", "The number of hiking trails", "How many species live on an island"], a: 0, why: "It turns consumption into an area so it can be compared with what the planet provides." } },
    { id: "map", title: "Resort map", icon: "🗺️", advisor: "marcus", type: "map", expert: ["eng", "cs", "bio"],
      brief: ["Now place each facility on the island. Height above sea level, distance from habitats, and old bulldozed land all matter.", "Tap a facility, then tap a plot on the map. The auto-place button gives a solid starting layout."],
      insight: "Critical services on low ground are the first thing a storm surge finds.",
      science: "Siting matters as much as design. Building on previously disturbed land (a brownfield) avoids new habitat loss, and keeping critical services above flood height protects people in storms.",
      reflect: "Explain the layout of your ecoresort and why you sited the most important facilities where you did.",
      quiz: { q: "Why build on the abandoned resort site instead of intact forest?", opts: ["It avoids clearing new habitat and can reuse existing foundations", "Forest cannot legally be built on", "Brownfields never need cleanup"], a: 0, why: "Development on land that is already disturbed spares natural areas." } },
    { id: "tbl", title: "Triple bottom line", icon: "🔵", advisor: "elena", type: "tbl", expert: ["biz", "pol", "cs"],
      brief: ["The triple bottom line asks whether your resort works for planet, people, and profit at the same time. The overlap is what counts as sustainable."],
      insight: "The overlap is a geometric mean, so one weak circle drags the whole score down.",
      science: "Sustainability lives where environmental responsibility, social well-being, and economic growth overlap. Weakness in one circle shrinks the overlap.",
      reflect: "Explain how your resort relates to environmental responsibility, social well-being, and economic growth.",
      quiz: { q: "Which three areas make up the triple bottom line?", opts: ["People, planet, and profit", "Politics, plastic, and price", "Plants, power, and pollution"], a: 0, why: "Success is measured in social, environmental, and financial results together." } },
    { id: "sim", title: "The first ten years", icon: "⏳", advisor: "elena", type: "sim", expert: ["biz", "pol", "soc"],
      brief: ["It is 2030 and the ribbon is cut. Ten years of storms, market swings, and community decisions are ahead. How you prepared will show."],
      insight: "Your earlier choices set the odds. Your responses now decide how bad a bad year gets." },
    { id: "results", title: "Final report", icon: "🏆", advisor: "elena", type: "results", expert: ["comm"],
      brief: ["The board has reviewed your first decade. Here is how the island and the business ended up."],
      insight: "Communicate the honest story. Guests and communities can tell when a pitch hides its tradeoffs." }
  ];

        { label: "Decline politely", mult: 0.0, extra: { cash: -2, comm: 3, bio: 1 }, msg: "You stay small and stay trusted." } ] },
    { id: "bleach", year: 5, icon: "🌡️", title: "Marine heat wave",

      choices: [
        { label: "Close reef tours for six weeks and shade coral nurseries", mult: 0.6, extra: { cash: -3, comm: 1 }, msg: "Corals get a break. Tour income dips." },
        { label: "Keep tours running with tighter limits", mult: 1.0, extra: {}, msg: "A mixed outcome. Some coral recovers." },
        { label: "Business as usual", mult: 1.4, extra: { cash: 2, comm: -2 }, msg: "Tour revenue holds, coral death spreads." } ] },
    { id: "outbreak", year: 6, icon: "🦠", title: "Illness spreads among staff",
      text: "A mosquito-borne fever appears in the staff village after heavy rains.",
      sevKey: "outbreak", impact: { health: -12, comm: -3, cash: -4, guest: -3 },

        { label: "Rapid testing, targeted drainage, and paid sick leave", mult: 0.5, extra: { cash: -2, comm: 3 }, msg: "Cases peak within a week and fall." },
        { label: "Follow the clinic's standard protocol", mult: 1.0, extra: {}, msg: "Control takes a few weeks." },
        { label: "Fog the whole island with pesticide", mult: 0.8, extra: { bio: -5, comm: -3, cash: -1 }, msg: "Mosquitoes drop fast, and so do pollinators and reef fish." } ] },
    { id: "species", year: 7, icon: "🔬", title: "Indicator species report",

    { id: "press", year: 8, icon: "📰", title: "A travel magazine features you",

        { label: "Keep your caps and raise prices", mult: 0.3, extra: { cash: 8, guest: 2 }, msg: "Higher margin without more crowds." },

    { id: "surge", year: 9, icon: "🌊", title: "King tide and storm surge",

      sevKey: "surge", impact: { cash: -9, resil: -4, bio: -4, guest: -4, comm: -2 }, fx: "flood",

<script>
/* Island Reborn: SVG avatar generator. Bust portraits for directors and advisors. */
(function () {
  const SKIN = ["#f6d6b8", "#ebbb93", "#d09a6a", "#a86f47", "#7c4a2d", "#4f2f1d"];
  const HAIR = ["#1d1511", "#4a2e1a", "#8a5a2b", "#c9a25a", "#b23a2a", "#a3a8ad", "#2d5bd4", "#7a3fbf"];
  const OUTFIT = ["#0B7A75", "#F4A825", "#2b6cb0", "#c0392b", "#6b46c1", "#334155", "#2f855a", "#dd6b20"];
  const STYLES = ["short", "long", "curly", "bun", "buzz", "wavy", "puff"];
  const ACCS = ["none", "glasses", "shades", "sunhat", "headset"];
  const BGS = ["#cfe8e4", "#f6e6c4", "#dbe6f3", "#f3dccf", "#e2dcf3", "#d9eadb"];
  let uid = 0;

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
    r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
    return "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  }

  function hairBack(style, c) {
    switch (style) {
      case "long": return `<path d="M31 58 C26 20 94 20 89 58 L94 108 L26 108 Z" fill="${c}"/>`;
      case "wavy": return `<path d="M31 58 C26 20 94 20 89 58 C92 72 88 84 84 90 C78 82 42 82 36 90 C32 84 28 72 31 58 Z" fill="${c}"/>`;
      case "puff": return `<circle cx="60" cy="42" r="35" fill="${c}"/>`;
      default: return "";
    }
  }
  function hairFront(style, c) {
    switch (style) {
      case "buzz": return `<path d="M36 48 C36 32 48 27 60 27 C72 27 84 32 84 48 C78 41 70 39 60 39 C50 39 42 41 36 48 Z" fill="${c}" opacity=".85"/>`;
      case "curly": return [[38, 43, 10], [48, 31, 11], [60, 27, 12], [72, 31, 11], [82, 43, 10], [35, 55, 8], [85, 55, 8]]
        .map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="${p[2]}" fill="${c}"/>`).join("");
      case "bun": return `<circle cx="60" cy="16" r="10" fill="${c}"/><path d="M35 50 C33 28 50 21 60 21 C72 21 87 28 85 50 C80 40 70 36 60 36 C50 36 40 40 35 50 Z" fill="${c}"/>`;
      case "puff": return `<path d="M36 50 C37 34 48 30 60 30 C72 30 83 34 84 50 C78 42 70 39 60 39 C50 39 42 42 36 50 Z" fill="${c}"/>`;
      default: return `<path d="M35 52 C32 26 50 19 60 19 C72 19 88 26 85 52 C80 41 70 36 60 36 C50 36 40 41 35 52 Z" fill="${c}"/>`;
    }
  }
  function accessory(kind) {
    switch (kind) {
      case "glasses": return `<g fill="none" stroke="#1f2933" stroke-width="2"><circle cx="51" cy="56" r="7.5"/><circle cx="69" cy="56" r="7.5"/><path d="M58.5 55 H61.5"/></g>`;
      case "shades": return `<g fill="#111827"><rect x="42" y="50" width="16" height="10" rx="4"/><rect x="62" y="50" width="16" height="10" rx="4"/><rect x="57" y="53" width="6" height="2"/></g>`;
      case "sunhat": return `<ellipse cx="60" cy="36" rx="44" ry="9" fill="#e9c46a"/><path d="M40 36 C40 14 80 14 80 36 Z" fill="#f2d68a"/><rect x="40" y="30" width="40" height="5" fill="#0B7A75"/>`;
      case "headset": return `<path d="M34 56 C32 20 88 20 86 56" fill="none" stroke="#1f2933" stroke-width="4"/><rect x="29" y="52" width="9" height="16" rx="4" fill="#1f2933"/><rect x="82" y="52" width="9" height="16" rx="4" fill="#1f2933"/><path d="M86 66 C86 76 78 80 70 79" fill="none" stroke="#1f2933" stroke-width="2.5"/><circle cx="69" cy="79" r="3" fill="#1f2933"/>`;
      default: return "";
    }
  }

  function svg(a, size, opts) {
    a = a || {}; opts = opts || {};
    const id = "av" + (++uid);
    const skin = SKIN[(a.skin || 0) % SKIN.length];
    const skinD = shade(skin, -22);
    const hair = HAIR[(a.hairColor || 0) % HAIR.length];
    const outfit = OUTFIT[(a.outfit || 0) % OUTFIT.length];
    const bg = a.bg || BGS[0];
    const style = a.hairStyle || "short";
    const smile = a.mood === "worried" ? "M53 73 Q60 70 67 73" : "M52 71 Q60 79 68 71";
    const badge = opts.badge ? `<g><circle cx="98" cy="98" r="14" fill="#0D2137" stroke="#fff" stroke-width="2"/><text x="98" y="104" text-anchor="middle" font-size="16">${opts.badge}</text></g>` : "";
    return `<svg class="avatar" viewBox="0 0 120 120" width="${size || 96}" height="${size || 96}" role="img" aria-label="${(opts.label || "Avatar").replace(/"/g, "")}" xmlns="http://www.w3.org/2000/svg">
<defs><clipPath id="${id}"><circle cx="60" cy="60" r="58"/></clipPath></defs>
<g clip-path="url(#${id})">
<rect width="120" height="120" fill="${bg}"/>
${hairBack(style, hair)}
<path d="M6 124 C8 96 32 88 60 88 C88 88 112 96 114 124 Z" fill="${outfit}"/>
<path d="M48 89 L60 104 L72 89 Z" fill="${skinD}"/>
<rect x="50" y="68" width="20" height="24" rx="8" fill="${skinD}"/>
<circle cx="35" cy="58" r="5" fill="${skin}"/><circle cx="85" cy="58" r="5" fill="${skin}"/>
<ellipse cx="60" cy="54" rx="25" ry="28" fill="${skin}"/>
${hairFront(style, hair)}
<circle cx="51" cy="56" r="2.6" fill="#1a1a1a"/><circle cx="69" cy="56" r="2.6" fill="#1a1a1a"/>
<path d="M45 48 Q51 45 57 48 M63 48 Q69 45 75 48" stroke="${shade(hair, -10)}" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M60 58 Q57 66 61 66" stroke="${skinD}" stroke-width="1.8" fill="none" stroke-linecap="round"/>

${accessory(a.acc)}
</g>
<circle cx="60" cy="60" r="58" fill="none" stroke="#0D2137" stroke-width="3"/>
${badge}
</svg>`;
  }

  function random() {
    const r = n => Math.floor(Math.random() * n);
    return { skin: r(SKIN.length), hairStyle: STYLES[r(STYLES.length)], hairColor: r(HAIR.length), outfit: r(OUTFIT.length), acc: ACCS[r(ACCS.length)], bg: BGS[r(BGS.length)] };
  }

  window.Avatars = { SKIN, HAIR, OUTFIT, STYLES, ACCS, BGS, svg, random, shade };
})();

<script>
/* Island Reborn: state, scoring model, placement rules, validation, achievements. */
(function () {
  const D = window.DATA, C = window.ECO_CONFIG;
  const clamp = (v, a, b) => Math.max(a == null ? 0 : a, Math.min(b == null ? 100 : b, v));

  // ---------- Island geometry shared by the scene and the model ----------
  const Geo = {
    W: 960, H: 600, CX: 480, CY: 318, RX: 330, RY: 195,
    R(a) { return 1 + 0.10 * Math.sin(2 * a + 0.6) + 0.07 * Math.sin(3 * a + 1.9) + 0.05 * Math.sin(5 * a + 0.3); },
    P(a, s) { const r = Geo.R(a) * s; return { x: Geo.CX + Geo.RX * r * Math.cos(a), y: Geo.CY + Geo.RY * r * Math.sin(a) }; }
  };
  D.plots.forEach(p => { const pt = Geo.P(p.a * Math.PI / 180, p.s); p.x = pt.x; p.y = pt.y; });

  const phaseOfGroup = { lodging: "concept", water: "water", food: "food", energy: "energy", waste: "waste" };
  const CATS = {
    lodging: "Lodging and building", recreation: "Recreation", water: "Water", food: "Food", energy: "Energy", waste: "Waste",
    transportIsland: "Transport", transportOff: "Transport", housing: "Staff housing", housingPolicy: "Staff housing", footprint: "Reduction measures"
  };

  function opt(gid, oid) { const g = D.groupById[gid]; return g ? g.options.find(o => o.id === oid) : null; }
  function lock(s, o) {
    const NPC = window.NPCS, tr = s.trust || {};
    if (o.block) { const v = tr[o.block.npc] || 0; if (v <= o.block.max) return { locked: true, kind: "block", why: `${NPC.N[o.block.npc].name} will not work with you until you rebuild trust (now ${v}). Talk with them again or finish a quest for them.` }; }
    if (o.need) {
      if (o.need.trust) { const v = tr[o.need.trust.npc] || 0; if (v < o.need.trust.min) return { locked: true, kind: "need", why: `Earn ${NPC.N[o.need.trust.npc].name}'s trust (${v} of ${o.need.trust.min}) by asking good questions on the island.` }; }
      if (o.need.quest) { const q = s.quests && s.quests[o.need.quest]; if (!q || q.st !== "done") { const qd = NPC.quests.find(x => x.id === o.need.quest); return { locked: true, kind: "need", why: `Unlocked by finishing the side quest "${qd.title}".` }; } }
    }
    return { locked: false };
  }
  function selected(s, gid) { return (s.sel[gid] || []).map(id => opt(gid, id)).filter(o => o && !lock(s, o).locked); }
  function prune(s) {
    const out = [];
    D.groups.forEach(g => { const keep = (s.sel[g.id] || []).filter(id => { const o = opt(g.id, id); const l = o ? lock(s, o) : { locked: true }; if (l.locked && o) out.push(o.name); return !l.locked; }); s.sel[g.id] = keep; });
    return out;
  }
  function has(s, gid, oid) { return (s.sel[gid] || []).indexOf(oid) >= 0; }
  function phaseId(s) { return D.phases[s.phase].id; }

  function newState(diff) {
    const s = {
      v: 1, difficulty: diff || "standard", phase: 0, done: {}, kp: 0,
      team: [0, 1, 2].map(i => ({ name: "", major: ["bio", "biz", "eng"][i], role: D.roles[[0, 1, 2][i]], av: window.Avatars.random() })),
      resortName: "", tagline: "", palette: 0,
      visitors: 40, sel: {}, invest: { watershed: 8, inland: 8, mangrove: 8, reef: 8 },
      species: null, nicheAnswers: {}, pillarAnswers: {}, place: {}, quiz: {}, reflect: {},
      objectives: [5, 5, 5, 5, 5], civic: {}, sim: null, startedAt: Date.now(),
      talked: {}, skipped: {}, trust: {}, tips: {}, found: {}, debris: [], debrisPaid: false, hero: 0,
      quests: {}, reacted: {}, bonus: {}, tut: { on: false, steps: {} }
    };
    D.groups.forEach(g => { s.sel[g.id] = []; });
    return s;
  }

  // ---------- Placement rules ----------
  function evalPlacement(fid, plot, s) {
    const t = plot.t, notes = [], e = { bio: 0, wq: 0, comm: 0, health: 0, guest: 0, resil: 0, empl: 0, cost: 0 }, z = {};
    let exposed = false;
    const say = (tone, text) => notes.push({ tone, text });
    const crit = ["energy", "water", "waste", "housing", "clinic"].indexOf(fid) >= 0;
    if (plot.elev === 0 && (crit || fid === "lodging")) {
      exposed = true;
      if (fid === "housing") { e.empl -= 8; e.resil -= 3; say("bad", "Low-lying staff housing floods first in a surge."); }
      else if (fid === "lodging") { e.resil -= 3; say("warn", "Beachfront lodging is exposed to storm surge."); }
      else { e.resil -= 6; say("bad", "A critical service on low ground is exposed to storm surge."); }
    } else if (plot.elev === 2 && (crit || fid === "lodging")) { e.resil += 2; say("good", "High ground stays dry in storms."); }
    if (fid === "lodging") {
      if (t.indexOf("coast") >= 0) { e.guest += 7; say("good", "Beach access delights guests."); }
      else { e.guest -= 2; say("warn", "No water views, so guests are less thrilled."); }
    }
    if (t.indexOf("brownfield") >= 0) { e.bio += 4; e.comm += 2; e.cost -= 2; say("good", "Reuses land the last developer already cleared."); }
    if (t.indexOf("mangrove") >= 0) {
      if (fid === "edu") { e.comm += 3; say("good", "A live classroom beside the mangroves."); }
      else { z.mangrove = (z.mangrove || 0) - 6; e.bio -= 4; say("bad", "Too close to the mangrove nursery."); }
    }
    if (t.indexOf("pond") >= 0) {
      if (fid === "waste") { e.wq -= 8; say("bad", "Leachate risk to the freshwater pond."); }
      else if (fid === "food") { e.wq -= 3; e.cost -= 1; say("warn", "Easy irrigation, but fertilizer could reach the pond."); }
      else if (fid === "lodging" || fid === "housing") { e.wq -= 3; say("warn", "Wastewater risk near the pond."); }
      else if (fid === "edu") { e.comm += 2; say("good", "The pond makes a fine outdoor classroom."); }
    }
    if (t.indexOf("forest") >= 0 && fid !== "edu") { z.inland = (z.inland || 0) - 5; e.bio -= 4; say("bad", "Clears intact forest habitat."); }
    if (fid === "transport") {
      if (t.indexOf("coast") < 0) { e.guest -= 6; e.cost += 3; say("bad", "No natural harbor. Everything is hauled a long way."); }
      else say("good", "Sheltered water for a dock.");
    }
    if (fid === "water" && has(s, "water", "ro_solar")) {
      if (t.indexOf("coast") >= 0) { e.cost -= 1; say("good", "Short intake and brine pipes."); }
      else { e.cost += 2; say("warn", "A long seawater pipeline is needed."); }
    }
    if (fid === "clinic") {
      if (t.indexOf("interior") >= 0 || plot.elev >= 1) { e.health += 4; say("good", "Central and safe, so care is quick to reach."); }
      else { e.health -= 2; say("warn", "Far from most guests and staff."); }
    }
    if (fid === "energy" && plot.elev >= 1 && t.indexOf("forest") < 0 && t.indexOf("mangrove") < 0) say("good", "Open, sunny, breezy ground suits energy.");
    if (!notes.length) say("ok", "A solid, low-impact site.");
    return { notes, e, z, exposed };
  }

  function placementReport(s) {
    const items = {}, e = { bio: 0, wq: 0, comm: 0, health: 0, guest: 0, resil: 0, empl: 0, cost: 0 }, z = {};
    let exposed = 0, count = 0;
    D.facilities.forEach(f => {
      const pid = s.place[f.id]; if (!pid) return;
      const plot = D.plots.find(p => p.id === pid); if (!plot) return;
      const r = evalPlacement(f.id, plot, s); count++;
      items[f.id] = r;
      for (const k in r.e) e[k] += r.e[k];
      for (const k in r.z) z[k] = (z[k] || 0) + r.z[k];
      if (r.exposed) exposed++;
    });
    return { items, e, z, exposed, complete: count === D.facilities.length };
  }

  function scorePlot(fid, plot, s) {
    const r = evalPlacement(fid, plot, s);
    let sc = r.e.bio + r.e.wq + r.e.comm + r.e.health + r.e.guest + r.e.resil + r.e.empl - r.e.cost * 2;
    for (const k in r.z) sc += r.z[k] * 1.2;
    if (r.exposed) sc -= 3;
    if (fid === "lodging" && has(s, "lodging", "reuse") && plot.t.indexOf("brownfield") >= 0) sc += 6;
    if (fid === "housing" && has(s, "housing", "adaptive") && plot.t.indexOf("brownfield") >= 0) sc += 6;
    return sc;
  }

  function autoPlace(s) {
    const order = ["transport", "lodging", "waste", "energy", "water", "clinic", "housing", "food", "edu"];
    const used = {}, out = {};
    order.forEach(fid => {
      let best = null, bs = -1e9;
      D.plots.forEach(p => { if (used[p.id]) return; const sc = scorePlot(fid, p, s); if (sc > bs) { bs = sc; best = p; } });
      if (best) { used[best.id] = 1; out[fid] = best.id; }
    });
    return out;
  }

  // ---------- Scoring model ----------
  function compute(s) {
    const V = s.visitors, k = V / 40, curPhase = phaseId(s), budget = C.difficulty[s.difficulty].budget;
    const tot = { cost: 0, ops: 0, rev: 0, fp: 0, bio: 0, wq: 0, comm: 0, health: 0, guest: 0, resil: 0, jobs: 0, edu: 0, empl: 0, conn: 0 };
    const z = { watershed: 0, inland: 0, mangrove: 0, reef: 0 };
    const caps = { water: 0, food: 0, energy: 0, waste: 0, lodging: 0 }, dems = { water: 0, food: 0, energy: 0, waste: 0, lodging: 0 };
    const fpBy = {}, flags = {};
    let renewCap = 0, energyCap = 0, localCap = 0, foodCap = 0, lodgeRevNum = 0;
    const mitSum = selected(s, "mitigation").reduce((a, o) => a + (o.mit || 0), 0);
    const mitF = clamp(1 - mitSum, 0.35, 1);

    D.groups.forEach(g => {
      selected(s, g.id).forEach(o => {
        flags[o.id] = true; if (o.flag) flags[o.flag] = true;
        const sk = o.v || [];
        for (const key in o.eff) {
          const raw = o.eff[key];
          if (key === "z") {
            for (const zz in raw) { let val = raw[zz]; if (g.id === "recreation" && val < 0) val *= mitF; z[zz] += val; }
            continue;
          }
          if (key === "cap") { caps[g.id] = (caps[g.id] || 0) + raw; continue; }
          if (key === "dem") { dems[g.id] = (dems[g.id] || 0) + raw; continue; }
          if (key === "rev") {
            if (g.id === "lodging") lodgeRevNum += raw * (o.eff.cap || 0);
            else if (g.id === "recreation") tot.rev += raw * 0.35;
            else tot.rev += raw;
            continue;
          }
          let val = raw * (sk.indexOf(key) >= 0 ? k : 1);
          if (g.id === "recreation" && val < 0 && (key === "bio" || key === "wq")) val *= mitF;
          if (key in tot) tot[key] += val;
          if (key === "fp") { const c = CATS[g.id] || "Other"; fpBy[c] = (fpBy[c] || 0) + val; }
        }
        if (g.id === "energy" && o.eff.cap) { energyCap += o.eff.cap; if (o.renew) renewCap += o.eff.cap; }
        if (g.id === "food" && o.eff.cap) { foodCap += o.eff.cap; if (o.local) localCap += o.eff.cap; }
      });
    });

    for (const bk in (s.bonus || {})) if (bk in tot) tot[bk] += s.bonus[bk];
    if (caps.lodging > 0) tot.rev += lodgeRevNum / caps.lodging;
    // Diminishing returns: piling up positives helps less and less.
    const soft = T => (T > 0 ? 45 * (1 - Math.exp(-T / 45)) : T);
    ["bio", "wq", "comm", "health", "guest", "resil", "empl"].forEach(key => { tot[key] = soft(tot[key]); });

    const applies = g => !!s.done[phaseOfGroup[g]] || curPhase === phaseOfGroup[g];
    const cov = {}, short = {};
    ["water", "food", "energy", "waste", "lodging"].forEach(g => {
      const need = V * (g === "lodging" ? 1 : 1.7) * clamp(dems[g] >= 0 ? 1 - dems[g] : 1, 0.4, 1);
      cov[g] = need > 0 ? caps[g] / need : 0;
      short[g] = clamp(1 - cov[g], 0, 1);
    });

    const operating = !!s.done.concept || s.phase >= D.phases.findIndex(p => p.id === "concept");
    const effV = operating ? V * Math.min(1, cov.lodging) : 0;
    let emergOps = 0, emergFp = 0, guestPen = 0, healthPen = 0;
    ["water", "food", "energy", "waste"].forEach(g => {
      if (!applies(g)) return;
      emergOps += short[g] * V * 0.06; emergFp += short[g] * 10; guestPen += short[g] * 25;
      if (g === "water") healthPen += short[g] * 12;
    });
    tot.fp += emergFp; if (emergFp) fpBy["Emergency imports"] = emergFp;
    const fpBase = 10 + 10 * k; fpBy["Guest stay (baseline)"] = fpBase;

    const includeInvest = !!s.done.habitats || curPhase === "habitats";
    const plc = placementReport(s);
    const pe = plc.complete ? plc.e : { bio: 0, wq: 0, comm: 0, health: 0, guest: 0, resil: 0, empl: 0, cost: 0 };
    const pz = plc.complete ? plc.z : {};

    const zq = {};
    D.zones.forEach(zn => {
      const inv = includeInvest ? s.invest[zn.id] : 0;
      let q = zn.base + (100 - zn.base) * (1 - Math.exp(-inv / zn.k));
      q += z[zn.id] + (pz[zn.id] || 0);
      zq[zn.id] = clamp(q);
    });
    const zv = D.zones.map(zn => zq[zn.id]);
    const zmean = zv.reduce((a, b) => a + b, 0) / zv.length, zmin = Math.min.apply(null, zv);
    const conn = clamp(20 + tot.conn);
    const bio = clamp(0.5 * zmean + 0.3 * zmin + 0.2 * conn + tot.bio + pe.bio);
    const wq = clamp(35 + 0.25 * zq.watershed + 0.15 * zq.mangrove + 0.10 * zq.reef + tot.wq + pe.wq);
    const jobs = operating ? Math.round(effV * 1.4 + tot.jobs) : 0;
    const trustSum = Object.keys(s.trust || {}).reduce((a2, k) => a2 + s.trust[k], 0);
    const trustBonus = clamp(trustSum * 0.25, -8, 10);
    const comm = clamp(30 + tot.comm + Math.min(12, jobs / 15) + pe.comm + trustBonus);
    const health = clamp(35 + tot.health + 0.2 * (wq - 40) + pe.health - healthPen);
    const crowd = Math.max(0, V - 50) * 0.5;
    const guest = clamp(40 + tot.guest + 0.3 * (bio - 40) + 0.15 * (wq - 50) - guestPen - crowd + pe.guest);
    const resil = clamp(20 + tot.resil + 0.2 * zq.mangrove + 0.12 * zq.reef + 0.05 * zq.inland + pe.resil);
    const edu = clamp(tot.edu * 2.2);
    const empl = clamp(45 + tot.empl + pe.empl);
    const fpIdx = clamp(fpBase + tot.fp, 0, 100);
    const fpScore = clamp(100 - fpIdx * 1.6);

    const cfgE = C.economics;
    const revenue = operating ? effV * (cfgE.baseRevenuePerVisit + tot.rev) / 1000 * (0.8 + 0.4 * guest / 100) : 0;
    const capex = cfgE.sitePrepCost + tot.cost + (includeInvest ? Object.keys(s.invest).reduce((a, id) => a + s.invest[id], 0) : 0) + pe.cost;
    const over = Math.max(0, capex - budget), interest = over * cfgE.loanRate;
    const opsCost = operating ? effV * cfgE.baseOpsPerVisit / 1000 + tot.ops + emergOps + interest : 0;
    const profit = revenue - opsCost;
    const payback = profit > 0 ? capex / profit : 99;
    const econCore = !operating ? 0 : profit <= 0 ? 5 : clamp(100 - (payback - 4) * 6);
    const econ = !operating ? 0 : clamp(0.75 * econCore + 0.25 * guest - over * 0.25);
    const env = 0.4 * bio + 0.25 * wq + 0.2 * fpScore + 0.15 * resil;
    const soc = 0.35 * comm + 0.25 * health + 0.2 * empl + 0.2 * edu;
    const tbl = Math.cbrt(Math.max(0, env) * Math.max(0, soc) * Math.max(0, econ));

    let viability = null;
    const sp = D.species.find(x => x.id === s.species);
    if (sp) {
      let w = 0; for (const id in sp.needs) w += sp.needs[id] * zq[id];
      viability = clamp(0.7 * w + 0.3 * conn + 0.25 * (bio - 40));
    }

    return {
      V, effV, operating, tot, zq, conn, bio, wq, comm, health, guest, resil, edu, empl, fpIdx, fpScore, fpBy,
      revenue, opsCost, profit, capex, budget, over, payback, econ, env, soc, tbl,
      caps, cov, short, jobs, flags, viability, plc, trustBonus, trustSum, mitF, exposed: plc.complete ? plc.exposed : 0,
      renewShare: energyCap ? renewCap / energyCap : 0, localShare: foodCap ? localCap / foodCap : 0
    };
  }

  // ---------- Validation ----------
  function validatePhase(s, idx) {
    const ph = D.phases[idx], issues = [];
    const groupIssues = gid => {
      const g = D.groupById[gid], sel = selected(s, gid);
      if (sel.length < g.min) issues.push(`${g.title}: choose at least ${g.min}.`);
      sel.forEach(o => { if (o.violates) issues.push(`Remove "${o.name}". ${o.violates}`); });
    };
    (ph.groups || []).forEach(groupIssues);
    if (ph.consult && !s.talked[ph.id] && !s.skipped[ph.id] && window.NPCS) {
      const n = window.NPCS.N[ph.consult];
      issues.push(`Talk to ${n.name} (${n.role}) at ${n.spot}. Walk there on the island, or skip below.`);
    }
    switch (ph.type) {
      case "team":
        s.team.forEach((m, i) => { if (!m.name.trim()) issues.push(`Give director ${i + 1} a name.`); });
        if (new Set(s.team.map(m => m.role)).size < 3) issues.push("Give each director a different role.");
        break;
      case "name": if (s.resortName.trim().length < 3) issues.push("Give your resort a name of at least 3 letters."); break;
      case "species":
        if (!s.species) issues.push("Choose an indicator species.");
        else if (Object.keys(s.nicheAnswers).filter(k => k.indexOf(s.species + ":") === 0).length < 4) issues.push("Answer all four niche questions.");
        break;
      case "earthcharter":
        if (Object.keys(s.pillarAnswers).length < D.pillarQuiz.length) issues.push("Match every statement to a pillar.");
        break;
      case "map":
        if (D.facilities.some(f => !s.place[f.id])) issues.push("Place all nine facilities on the map.");
        break;
      case "midpoint": case "tbl":
        if ((s.reflect[ph.id] || "").trim().length < 15) issues.push("Write a short reflection (at least a sentence).");
        break;
    }
    return issues;
  }

  // ---------- Achievements ----------
  const ACHIEVEMENTS = [
    { id: "mangrove", icon: "🌱", name: "Mangrove guardian", desc: "Mangrove quality of 75 or more.", test: (m) => m.zq.mangrove >= 75 },
    { id: "reef", icon: "🪸", name: "Reef restorer", desc: "Reef quality of 75 or more.", test: (m) => m.zq.reef >= 75 },
    { id: "sun", icon: "☀️", name: "Sun and wind island", desc: "At least 80% renewable power, fully covered.", test: (m) => m.renewShare >= 0.8 && m.cov.energy >= 1 },
    { id: "loop", icon: "♻️", name: "Closed loop", desc: "Waste covered without shipping or dumping.", test: (m, s) => m.cov.waste >= 1 && !has(s, "waste", "ship") && !has(s, "waste", "landfill") },
    { id: "neighbors", icon: "🤝", name: "Good neighbors", desc: "Community score of 75 or more.", test: (m) => m.comm >= 75 },
    { id: "brown", icon: "🏗️", name: "Brownfield hero", desc: "Reused the old resort site and deconstructed it.", test: (m, s) => s.place && D.plots.find(p => p.id === s.place.lodging || p.id === s.place.housing || p.id === s.place.energy || p.id === s.place.water) && Object.keys(s.place).some(f => s.place[f] === "p12") && !!m.flags.decon },
    { id: "storm", icon: "🌀", name: "Storm ready", desc: "Resilience of 70 or more and no critical services on low ground.", test: (m) => m.resil >= 70 && m.exposed === 0 },
    { id: "team", icon: "🧑‍🤝‍🧑", name: "Team of experts", desc: "Directors with expertise covering at least 70% of phases.", test: (m, s) => teamCoverage(s) >= 0.7 },
    { id: "tbl", icon: "🔵", name: "Triple bottom line", desc: "Environment, people, and profit all at 65 or more.", test: (m, s, fin) => fin && fin.env >= 65 && fin.soc >= 65 && fin.econ >= 65 }
  ];

  function teamCoverage(s) {
    const majors = s.team.map(m => m.major);
    const phases = D.phases.filter(p => p.expert);
    if (!phases.length) return 0;
    return phases.filter(p => p.expert.some(x => majors.indexOf(x) >= 0)).length / phases.length;
  }
  function leadDirector(s, phase, idx) {
    const cands = s.team.filter(m => (phase.expert || []).indexOf(m.major) >= 0);
    return cands.length ? cands[idx % cands.length] : null;
  }
  function rotatingDirector(s, idx) { return s.team[idx % s.team.length]; }

  // ---------- Persistence ----------
  function save(s) { if (!C.features.autosave) return; try { localStorage.setItem(C.storageKey, JSON.stringify(s)); } catch (e) { /* storage unavailable */ } }
  function load() { try { const t = localStorage.getItem(C.storageKey); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
  function clearSave() { try { localStorage.removeItem(C.storageKey); } catch (e) { /* ignore */ } }

  window.Model = { Geo, clamp, opt, lock, prune, selected, has, phaseId, newState, evalPlacement, placementReport, autoPlace, compute, validatePhase, ACHIEVEMENTS, teamCoverage, leadDirector, rotatingDirector, save, load, clearSave, CATS };
})();

</script>
<script>
/* Island Reborn: the people of the island. Townspeople, conversations, field spots, and the shoreline cleanup quest.
   Every phase with a "consult" person needs a conversation. Answers give local knowledge and change community trust. */
(function () {
  const D = window.DATA, G = window.Model.Geo;
  const pol = (a, s, dx, dy) => { const p = G.P(a * Math.PI / 180, s); return { x: p.x + (dx || 0), y: p.y + (dy || 0) }; };
  const V = pol(12, 0.72);   // the settlement

  const N = {};

<script>
/* Island Reborn: ten-year simulation. Your earlier decisions set the odds; your responses set the outcome. */
(function () {
  const D = window.DATA, C = window.ECO_CONFIG, M = window.Model;
  const clamp = M.clamp;
  const KEYS = ["bio", "wq", "comm", "health", "resil", "guest"];

  function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  function start(s) {
    const m = M.compute(s);
    s.sim = {
      year: 0, seed: Math.floor(Math.random() * 1e9), done: false,
      cur: { bio: Math.min(22, m.bio), wq: 45, comm: 35, health: 40, resil: 20, guest: 50 },
      dx: { bio: 0, wq: 0, comm: 0, health: 0, resil: 0, guest: 0 },
      cash: m.budget - m.capex, cumProfit: 0, history: [], pending: null, log: [], fx: null, final: null
    };
    return s.sim;
  }

  function severity(ev, m) {
    let v;
    switch (ev.sevKey) {
      case "permit": v = 1 - m.comm / 110; break;
      case "fuel": v = 0.3 + (1 - m.renewShare) + (m.flags.import ? 0.4 : 0) + (m.flags.diesel ? 0.3 : 0); break;
      case "hurricane": v = 0.5 + m.exposed * 0.16 - m.resil / 200; break;
      case "bleach": v = 0.9 - m.zq.reef / 200 - (m.flags.coralnursery ? 0.15 : 0); break;
      case "outbreak": v = 0.9 - m.health / 130; break;
      case "species": v = 0.9 - (m.viability == null ? 50 : m.viability) / 110; break;
      case "surge": v = 0.4 + m.exposed * 0.18 - m.resil / 180; break;
      case "flat": v = 1; break;
      default: v = 0;
    }
    return ev.sevKey === "none" || ev.sevKey === "flat" ? v : clamp(v, 0.15, 1.5);
  }

  function explain(ev, m) {
    const r = n => Math.round(n);
    switch (ev.sevKey) {
      case "permit": return `Your community score of ${r(m.comm)} shaped the mood in the room.`;
      case "fuel": return `${r(m.renewShare * 100)}% of your power is renewable, which set how exposed you were.`;
      case "hurricane": return `Your resilience is ${r(m.resil)} and ${m.exposed} critical or guest facilities sit on low ground.`;
      case "bleach": return `Your reef quality is ${r(m.zq.reef)}${m.flags.coralnursery ? ", helped by the heat-tolerant coral nursery" : ""}.`;
      case "outbreak": return `Your health score of ${r(m.health)} set how quickly the outbreak was contained.`;
      case "species": return `Your indicator species has a viability of ${m.viability == null ? "unknown" : r(m.viability)}.`;
      case "surge": return `Your resilience is ${r(m.resil)} and ${m.exposed} facilities sit on low ground.`;
      default: return "";
    }
  }

  // Advance to the next year and return the event awaiting a decision.
  function nextYear(s) {
    const sim = s.sim, m = M.compute(s);
    sim.year += 1;
    const y = sim.year, ramp = Math.min(1, 0.35 + 0.13 * y);
    KEYS.forEach(k => {
      sim.dx[k] *= 0.7;
      sim.cur[k] = clamp(sim.cur[k] + (m[k] + sim.dx[k] - sim.cur[k]) * 0.3);
    });
    const p = m.profit * ramp;
    sim.cash += p; sim.cumProfit += p; sim.lastProfit = p;
    const ev = D.events[y - 1];
    sim.pending = { ev, sev: severity(ev, m), why: explain(ev, m) };
    return sim.pending;
  }

  function resolve(s, choiceIdx) {
    const sim = s.sim, pend = sim.pending, ev = pend.ev, ch = ev.choices[choiceIdx];
    const rand = mulberry(sim.seed + sim.year * 101)();
    const diff = C.difficulty[s.difficulty];
    const sev = pend.sev * diff.sev * (0.9 + 0.3 * rand);
    const d = {};
    for (const k in ev.impact) d[k] = ev.impact[k] * sev * (ch.mult == null ? 1 : ch.mult);
    for (const k in ch.extra) d[k] = (d[k] || 0) + ch.extra[k];
    const out = {};
    for (const k in d) {
      const v = Math.round(d[k] * 10) / 10; out[k] = v;
      if (k === "cash") { sim.cash += v; sim.cumProfit += v; }
      else if (KEYS.indexOf(k) >= 0) { sim.dx[k] += v; sim.cur[k] = clamp(sim.cur[k] + v); }
    }
    sim.fx = ev.fx || null;
    const rec = { year: sim.year, event: ev.id, title: ev.title, choice: ch.label, msg: ch.msg, deltas: out, sev: Math.round(sev * 100) / 100 };
    sim.log.push(rec);
    sim.history.push({ year: sim.year, bio: sim.cur.bio, wq: sim.cur.wq, comm: sim.cur.comm, guest: sim.cur.guest, health: sim.cur.health, resil: sim.cur.resil, cash: sim.cash, cumProfit: sim.cumProfit });
    sim.pending = null;
    if (sim.year >= D.events.length) finish(s);
    return rec;
  }

  function grade(x) { return x >= 80 ? "A" : x >= 68 ? "B" : x >= 55 ? "C" : x >= 40 ? "D" : "F"; }

  function finish(s) {
    const sim = s.sim, m = M.compute(s), c = sim.cur;
    const env = 0.4 * c.bio + 0.25 * c.wq + 0.2 * m.fpScore + 0.15 * c.resil;
    const soc = 0.35 * c.comm + 0.25 * c.health + 0.2 * m.empl + 0.2 * m.edu;
    const ratio = m.capex > 0 ? sim.cumProfit / m.capex : 0;
    const econ = clamp(30 + 70 * ratio - m.over * 0.25 + (c.guest - 50) * 0.15);
    const tbl = Math.cbrt(Math.max(0, env) * Math.max(0, soc) * Math.max(0, econ));
    const fin = { bio: c.bio, wq: c.wq, comm: c.comm, health: c.health, resil: c.resil, guest: c.guest, env, soc, econ, tbl, grade: grade(tbl), cumProfit: sim.cumProfit, capex: m.capex, cash: sim.cash };
    fin.achievements = M.ACHIEVEMENTS.filter(a => { try { return a.test(m, s, fin); } catch (e) { return false; } }).map(a => a.id);
    fin.score = Math.round(tbl * 10 + s.kp);
    sim.final = fin; sim.done = true;
    return fin;
  }

  window.Sim = { start, nextYear, resolve, finish, grade };
})();

</script>
<script>
/* Island Reborn: facility sprites drawn on the canvas. Each variant reflects a decision the team made. */
(function () {
  const rect = (c, x, y, w, h, f) => { c.fillStyle = f; c.fillRect(x, y, w, h); };
  const circ = (c, x, y, r, f) => { c.fillStyle = f; c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.fill(); };
  const ell = (c, x, y, rx, ry, f) => { c.fillStyle = f; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, 6.2832); c.fill(); };
  const tri = (c, x1, y1, x2, y2, x3, y3, f) => { c.fillStyle = f; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineTo(x3, y3); c.closePath(); c.fill(); };
  const line = (c, x1, y1, x2, y2, col, w) => { c.strokeStyle = col; c.lineWidth = w || 1; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); };
  const has = (sel, g, id) => (sel[g] || []).indexOf(id) >= 0;
  const list = (sel, g) => sel[g] || [];

  function smoke(c, x, y, t, col, n) {
    for (let i = 0; i < (n || 3); i++) {
      const p = ((t * 0.5 + i / (n || 3)) % 1);
      c.globalAlpha = 0.5 * (1 - p); circ(c, x + Math.sin(p * 6 + i) * 3 + p * 8, y - p * 26, 2.5 + p * 4, col);
    }
    c.globalAlpha = 1;
  }

  const slots = [[-22, 6], [16, 8], [-2, -14], [28, -8]];

  function lodging(c, sel, t, d) {
    const v = list(sel, "lodging"); if (!v.length) return;
    v.forEach((id, i) => {
      const ox = v.length > 1 ? (i ? 26 : -26) : 0;
      c.save(); c.translate(ox, 0); if (v.length > 1) c.scale(0.85, 0.85);
      if (id === "cabins") {
        for (let j = 0; j < 3; j++) {
          const x = (j - 1) * 16, y = (j % 2) * 8 - 2;
          line(c, x - 5, y + 6, x - 5, y + 11, "#6b4a2b", 1.5); line(c, x + 5, y + 6, x + 5, y + 11, "#6b4a2b", 1.5);
          rect(c, x - 7, y - 2, 14, 8, "#c99a5b"); tri(c, x - 9, y - 2, x + 9, y - 2, x, y - 10, "#2f855a"); rect(c, x - 2, y + 1, 4, 5, "#7a5230");
        }
      } else if (id === "treehouse") {
        for (let j = 0; j < 2; j++) {
          const x = (j - 0.5) * 24;
          rect(c, x - 2, -4, 4, 16, "#6b4a2b"); circ(c, x, -8, 11, "rgba(47,125,58,.85)");
          rect(c, x - 6, -10, 12, 7, "#c08a4e"); tri(c, x - 8, -10, x + 8, -10, x, -17, "#8b5e34");
        }
      } else if (id === "reuse") {
        rect(c, -22, -6, 44, 15, "#d8d4c8"); rect(c, -22, -9, 44, 4, "#3f9b5b");
        for (let j = 0; j < 6; j++) rect(c, -18 + j * 7, -2, 4, 4, "#5b7c99");
        rect(c, -22, 9, 44, 2, "rgba(0,0,0,.15)");
      } else if (id === "overwater") {
        line(c, 0, 0, d.x * 48, d.y * 48, "#8b6b45", 3);
        for (let j = 0; j < 3; j++) {
          const px = d.x * (14 + j * 15) + -d.y * (j % 2 ? 9 : -9), py = d.y * (14 + j * 15) + d.x * (j % 2 ? 9 : -9);
          rect(c, px - 6, py - 4, 12, 8, "#e7c98a"); tri(c, px - 8, py - 4, px + 8, py - 4, px, py - 11, "#b98b4a");
        }
      }
      c.restore();
    });
  }

  function energy(c, sel, t, d) {
    const v = list(sel, "energy").filter(id => id !== "efficiency");
    v.forEach((id, i) => {
      const s = slots[i % 4]; c.save(); c.translate(s[0], s[1]);
      if (id === "solar") {
        for (let r = 0; r < 2; r++) for (let q = 0; q < 3; q++) {
          const x = q * 9 - 10, y = r * 7 - 3;
          c.fillStyle = "#1e40af"; c.beginPath(); c.moveTo(x, y + 5); c.lineTo(x + 3, y); c.lineTo(x + 11, y); c.lineTo(x + 8, y + 5); c.closePath(); c.fill();
          line(c, x + 4, y + 5, x + 6, y, "rgba(147,197,253,.8)", 0.8);
        }
      } else if (id === "wind") {
        line(c, 0, 4, 0, -24, "#e5e7eb", 2);
        const a = t * 2.2;
        for (let b = 0; b < 3; b++) line(c, 0, -24, Math.cos(a + b * 2.094) * 13, -24 + Math.sin(a + b * 2.094) * 13, "#f8fafc", 1.8);
        circ(c, 0, -24, 2, "#94a3b8");
      } else if (id === "biomass") {
        rect(c, -5, -14, 10, 18, "#94a3b8"); ell(c, 0, -14, 5, 3, "#64748b"); rect(c, 7, -6, 8, 10, "#a3b18a"); smoke(c, 0, -16, t, "#d1d5db", 3);
      } else if (id === "diesel") {
        rect(c, -9, -4, 18, 10, "#64748b"); rect(c, 4, -14, 4, 12, "#475569"); smoke(c, 6, -14, t, "#374151", 4);
      } else if (id === "tidal") {
        const x = d.x * 60, y = d.y * 60; c.save(); c.translate(-s[0], -s[1]);
        c.strokeStyle = "rgba(255,255,255,.5)"; c.lineWidth = 1; c.beginPath(); c.arc(x, y, 6 + Math.sin(t * 2) * 2, 0, 6.28); c.stroke();
        circ(c, x, y, 4, "#f59e0b"); circ(c, x, y, 1.5, "#fff"); c.restore();
      }
      c.restore();
    });
  }

  function water(c, sel, t, d) {
    const v = list(sel, "water").filter(id => id !== "fixtures");
    v.forEach((id, i) => {
      const s = slots[i % 4]; c.save(); c.translate(s[0], s[1]);
      if (id === "cistern") {
        for (let j = 0; j < 2; j++) { const x = j * 12 - 6; rect(c, x - 5, -8, 10, 12, "#9fb6c9"); ell(c, x, -8, 5, 2.5, "#c3d3e0"); ell(c, x, 4, 5, 2, "#8199ad"); }
      } else if (id === "ro_solar") {
        rect(c, -10, -8, 22, 12, "#f1f5f9"); rect(c, -10, -10, 22, 3, "#0ea5e9");
        line(c, 12, 0, d.x * 58, d.y * 58, "#38bdf8", 2);
        rect(c, -8, 6, 8, 3, "#1e40af");
      } else if (id === "wells") {
        rect(c, -3, -3, 6, 6, "#9ca3af"); line(c, 0, 0, 10, -8, "#dc2626", 2); circ(c, 10, -8, 2, "#dc2626");
      } else if (id === "greywater") {
        ell(c, 0, 0, 13, 7, "#6fbf73"); ell(c, 0, 0, 9, 4, "#94d6a0");
        for (let j = 0; j < 5; j++) line(c, -8 + j * 4, 1, -8 + j * 4 + Math.sin(t + j) * 1.5, -6, "#2f855a", 1);
      }
      c.restore();
    });
  }

  function food(c, sel, t, d) {
    const v = list(sel, "food").filter(id => id !== "foodwaste");
    v.forEach((id, i) => {
      const s = slots[i % 4]; c.save(); c.translate(s[0], s[1]);
      if (id === "agro") {
        c.fillStyle = "#7a5b34"; c.beginPath(); c.moveTo(-14, 6); c.lineTo(-8, -6); c.lineTo(14, -6); c.lineTo(8, 6); c.closePath(); c.fill();
        for (let j = 0; j < 4; j++) line(c, -12 + j * 4.5, 5, -7 + j * 4.5, -5, "#5cb85c", 1.6);
        circ(c, 14, -8, 4, "#3f8f4a"); circ(c, -14, -6, 3.5, "#4a9c4f");
      } else if (id === "aqua") {
        rect(c, -12, -6, 24, 12, "rgba(186,230,253,.85)"); tri(c, -12, -6, 12, -6, 0, -14, "rgba(186,230,253,.9)");
        for (let j = 0; j < 4; j++) line(c, -12 + j * 8, -6, -12 + j * 8, 6, "rgba(255,255,255,.8)", 1);
        rect(c, -8, 0, 16, 2, "#4ade80");
      } else if (id === "mari") {
        const x = d.x * 52, y = d.y * 52; c.save(); c.translate(-s[0], -s[1]);
        for (let j = 0; j < 3; j++) { rect(c, x - 12 + j * 9, y + Math.sin(t + j) * 1.2, 7, 4, "#9a7b4f"); circ(c, x - 9 + j * 9, y + 2, 1.6, "#f97316"); }
        c.restore();
      } else if (id === "coop") {
        ell(c, 0, 4, 9, 3, "#8b5e34"); tri(c, -9, 4, -12, 0, -6, 2, "#8b5e34"); line(c, 2, 4, 2, -8, "#5b3a1f", 1); tri(c, 2, -8, 2, 2, 10, 2, "#f8fafc");
        line(c, 12, -4, 22, -4, "#8b5e34", 1.5); for (let j = 0; j < 3; j++) ell(c, 14 + j * 3, -1, 1.5, 3, "#cbd5e1");
      } else if (id === "import") {
        rect(c, -10, -2, 8, 6, "#b45309"); rect(c, -2, -2, 8, 6, "#0f766e"); rect(c, -6, -8, 8, 6, "#9a3412");
      }
      c.restore();
    });
  }

  function waste(c, sel, t, d) {
    rect(c, -8, -4, 16, 10, "#a0aec0"); tri(c, -10, -4, 10, -4, 0, -11, "#5b6b7a");
    const v = list(sel, "waste").filter(id => id !== "decon");
    v.forEach((id, i) => {
      const s = slots[(i + 1) % 4]; c.save(); c.translate(s[0] + (s[0] < 0 ? -6 : 6), s[1] + 4);
